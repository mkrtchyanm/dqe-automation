[pytest]
minversion = 8.0
testpaths = tests
python_files = test_*.py

markers =
    validate_csv: marks tests that validate CSV content.
    unmarked: marks tests that do not have explicit marks.

addopts =
    -ra
    --strict-markers

rp_endpoint = https://reportportal.epam.com
rp_project = MANAN_MKRTCHYAN_PERSONAL
rp_api_key = <removed my api key before pushing>
rp_launch = PyTest_Introduction_Run
rp_launch_description = Pytest Introduction test suite execution report
rp_launch_attributes = 'Module:PyTest_Introduction' 'Environment:Dev' 'Framework:Pytest'
rp_is_skipped_an_issue = False
rp_log_level = INFO
