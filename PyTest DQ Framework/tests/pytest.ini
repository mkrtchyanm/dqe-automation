[pytest]
addopts = --strict-markers
markers =
    example: example framework usage test
    parquet_data: dataset checks against aggregated parquet outputs
    smoke: smoke checks for parquet dataset readiness
    facility_name_min_time_spent_per_visit_date: facility_name_min_time_spent_per_visit_date dataset
    facility_type_avg_time_spent_per_visit_date: facility_type_avg_time_spent_per_visit_date dataset
    patient_sum_treatment_cost_per_facility_type: patient_sum_treatment_cost_per_facility_type dataset
python_files = test_*.py
